name: Private OHOS capture preparation probe
on:
  push:
    branches: ['codex/harmony-host-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-ohos-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owned-frame-tests:
    if: github.repository == 'akurtlua-lgtm/rustdesk-private-build' && startsWith(github.ref, 'refs/heads/codex/harmony-host-')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Execute real native conversion tests with sanitizers
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            res/ohos-capture/frame.cpp res/ohos-capture/frame_test.cpp -o "$RUNNER_TEMP/owned-frame-tests"
          "$RUNNER_TEMP/owned-frame-tests"
          clang++ -std=c++17 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            res/ohos-capture/frame.cpp res/ohos-capture/delivery.cpp res/ohos-capture/delivery_test.cpp -o "$RUNNER_TEMP/delivery-tests"
          "$RUNNER_TEMP/delivery-tests"
  capture-sdk:
    needs: owned-frame-tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Download and verify the pinned public SDK
        run: |
          test "$(uname -m)" = arm64
          sdk_dir="$RUNNER_TEMP/ohos-capture-sdk"
          mkdir -p "$sdk_dir/archive" "$sdk_dir/api20"
          python3 - "$sdk_dir/sdk.tar.gz" <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          record=json.loads(Path('res/ohos/toolchain.json').read_text())
          archive=Path(sys.argv[1])
          subprocess.run(['curl','--fail','--location','--retry','3','--connect-timeout','30',
                          '--max-time','1200','--output',str(archive),record['sdk_url']],check=True)
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream,'sha256').hexdigest()==record['sdk_sha256']
          print('Official pinned public SDK digest passed')
          PY
          tar -xzf "$sdk_dir/sdk.tar.gz" -C "$sdk_dir/archive"
          unzip -q "$sdk_dir/archive/sdk/packages/ohos-sdk/darwin/native-darwin-arm64-6.0.0.47-Beta1.zip" -d "$sdk_dir/api20"
          echo "OHOS_SDK_ROOT=$sdk_dir/api20" >> "$GITHUB_ENV"
      - name: Compile and inspect the real ARM64 capture SDK library
        run: |
          set -euo pipefail
          cmake -S res/ohos-capture -B "$RUNNER_TEMP/ohos-capture-build" \
            -DCMAKE_TOOLCHAIN_FILE="$OHOS_SDK_ROOT/native/build/cmake/ohos.toolchain.cmake" \
            -DOHOS_ARCH=arm64-v8a -DOHOS_PLATFORM=OHOS -DOHOS_STL=c++_shared \
            -DRD_BUILD_OHOS_CAPTURE_PROBE=ON
          cmake --build "$RUNNER_TEMP/ohos-capture-build" --parallel 2
          mkdir -p capture-sdk-output
          cp "$RUNNER_TEMP/ohos-capture-build/libcapture_probe.so" capture-sdk-output/
          "$OHOS_SDK_ROOT/native/llvm/bin/llvm-readelf" -h -d -s capture-sdk-output/libcapture_probe.so > capture-sdk-output/ELF.txt
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          source=os.environ['GITHUB_SHA'];assert re.fullmatch('[a-f0-9]{40}',source)
          root=Path('capture-sdk-output');data=(root/'libcapture_probe.so').read_bytes();elf=(root/'ELF.txt').read_text()
          assert data[:6]==b'\x7fELF\x02\x01' and int.from_bytes(data[18:20],'little')==183
          assert 'libnative_avscreen_capture.so' in elf and 'RPATH' not in elf and 'RUNPATH' not in elf
          for name in ('Create','Init','SetMicrophoneEnabled','SetStateCallback','SetDataCallback','SetErrorCallback',
                       'StartScreenCapture','StopScreenCapture','Release'):
              assert 'OH_AVScreenCapture_'+name in elf
          for name in ('OH_AVBuffer_GetNativeBuffer','OH_NativeBuffer_MapPlanes','OH_NativeBuffer_Unmap','OH_NativeBuffer_Unreference'):
              assert name in elf
          record=dict(source=source,run_id=os.environ['GITHUB_RUN_ID'],sdk_api=20,sdk_version='6.0.0.47 Beta1',
                      architecture='arm64',library='libcapture_probe.so',size=len(data),sha256=hashlib.sha256(data).hexdigest(),
                      capture_sdk_linked=True,start_entry_present=True,sdk_lifecycle_entry_points_linked=True,
                      authorized_delivery_native_sanitized_cases=3,system_screen_capture_tested=False,
                      host_engine_connected=False,commercial_harmonyos_tested=False,physical_device_tested=False)
          (root/'verification.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ohos-capture-sdk-development-probe
          path: capture-sdk-output/*
          if-no-files-found: error
