name: Private iOS 27 capture API compatibility

on:
  push:
    branches: ['codex/ios-capture-api-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-broadcast-api:
    if: github.repository == 'akurtlua-lgtm/rustdesk-private-build' && startsWith(github.ref, 'refs/heads/codex/ios-capture-api-')
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Check the legacy ReplayKit frontend on both real SDK18 targets
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p legacy-api-output
          for sdk in iphoneos iphonesimulator; do
            version=$(xcrun --sdk "$sdk" --show-sdk-version)
            test "${version%%.*}" = 18
            target=arm64-apple-ios15.0
            if [[ "$sdk" == iphonesimulator ]]; then target=arm64-apple-ios15.0-simulator; fi
            xcrun --sdk "$sdk" swiftc -swift-version 6 -warnings-as-errors -target "$target" \
              -sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" -typecheck \
              res/ios-capture-frame/CaptureFrame.swift res/ios-capture-frame/CaptureDelivery.swift \
              res/ios-capture-frame/BroadcastCaptureHandler.swift
          done
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          source=os.environ['GITHUB_SHA']
          assert re.fullmatch('[a-f0-9]{40}',source)
          Path('legacy-api-output/verification.json').write_text(json.dumps(dict(
              source=source,run_id=os.environ['GITHUB_RUN_ID'],sdk_major=18,
              device_and_simulator_typechecked=True,minimum_ios=15,
              replaykit_broadcast_frontend_checked=True,system_screen_capture_tested=False,
              host_engine_connected=False,physical_device_tested=False),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios18-broadcast-frontend-api-check
          path: legacy-api-output/*
          if-no-files-found: error

  screen-capture-api:
    if: github.repository == 'akurtlua-lgtm/rustdesk-private-build' && startsWith(github.ref, 'refs/heads/codex/ios-capture-api-')
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify device APIs and the simulator unsupported capability without recording
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          mkdir -p capture-api-output
          for sdk in iphoneos iphonesimulator; do
            version=$(xcrun --sdk "$sdk" --show-sdk-version)
            test "${version%%.*}" = 27
            sdk_path=$(xcrun --sdk "$sdk" --show-sdk-path)
            target=arm64-apple-ios27.0
            if [[ "$sdk" == iphonesimulator ]]; then
              target=arm64-apple-ios27.0-simulator
              printf 'import ScreenCaptureKit\n' > "$RUNNER_TEMP/sck-import.swift"
              if xcrun --sdk "$sdk" swiftc -target "$target" -sdk "$sdk_path" -typecheck \
                "$RUNNER_TEMP/sck-import.swift" > "$RUNNER_TEMP/sck-import.log" 2>&1; then
                echo 'Simulator SDK now supports SCK; review capability implementation before proceeding.' >&2
                exit 1
              fi
              grep -F "no such module 'ScreenCaptureKit'" "$RUNNER_TEMP/sck-import.log"
            fi
            xcrun --sdk "$sdk" swiftc -swift-version 6 -warnings-as-errors \
              -target "$target" -sdk "$sdk_path" -typecheck \
              res/ios27-capture/VideoCaptureAPI.swift res/ios27-capture/SharingCapture.swift \
              res/ios-capture-frame/CaptureFrame.swift res/ios-capture-frame/CaptureDelivery.swift \
              res/ios-capture-frame/BroadcastCaptureHandler.swift
            printf '%s %s ARM64 Swift6 target typecheck passed\n' "$sdk" "$version" >> capture-api-output/SDK_CHECKS.txt
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          source = os.environ['GITHUB_SHA']
          if not re.fullmatch('[a-f0-9]{40}', source):
              raise ValueError('Full source SHA required')
          record = dict(source=source, run_id=os.environ['GITHUB_RUN_ID'],
                        xcode=subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
                        both_target_typechecks_passed=True, architecture='arm64',
                        device_screen_capture_api_checked=True,
                        simulator_screen_capture_api_available=False,
                        simulator_unsupported_capability_checked=True,
                        capture_executed=False, picker_presented=False,
                        remote_session_tested=False, physical_device_tested=False,
                        installable=False, signed=False)
          Path('capture-api-output/verification.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios27-screen-capture-api-check
          path: capture-api-output/*
          if-no-files-found: error

  existing-controller-on-ios27:
    if: github.repository == 'akurtlua-lgtm/rustdesk-private-build' && startsWith(github.ref, 'refs/heads/codex/ios-capture-api-')
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Require an actual ARM64 simulator host
        run: test "$(uname -m)" = arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 44514425331
          name: private-mobile-ios-simulator-arm64
          path: verified-client-input
      - name: Verify immutable controller fixture and install it on the current simulator
        run: python3 .github/scripts/check_existing_ios_client27.py
      - name: Execute actual synthetic CoreVideo conversion tests
        run: python3 .github/scripts/run_ios_pixel_buffer_tests.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios27-existing-controller-startup-check
          path: client-compat-output/*.json
          if-no-files-found: error
